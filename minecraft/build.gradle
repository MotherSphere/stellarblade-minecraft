plugins {
    id 'fabric-loom' version '1.11.8'
}

version = '0.1.0'
group = 'org.stellarbridge'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

tasks.register('bridgeRuntimeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.stellarbridge.BridgeRuntimeTest'
    jvmArgs '-ea'
}
check.dependsOn bridgeRuntimeTest

tasks.register('protocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.stellarbridge.BridgeProtocolTest'
    workingDir projectDir.parentFile
    jvmArgs '-ea'
}
check.dependsOn protocolTest

