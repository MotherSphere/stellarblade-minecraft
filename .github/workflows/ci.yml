# The offline checks on hosted runners, and the release build when release-please.yml calls it with a tag.
# The Windows DLL job builds xinput1_3.dll natively and runs its portable tests; the Linux job runs tools/check.py with
# that DLL in place, so the installer's tests embed and install the real pieces on fake trees, and stages that payload;
# the Windows installer job builds and tests the installer for Windows with the same payload. The Linux job also builds
# the pack builder's two EveExtract sidecars: each installer embeds its OS's one (SBMC_EVE_EXTRACT), and a release
# attaches both for running by hand. The Windows bridge job runs the Java suites and tools/check.py's windows component
# on Windows itself (locally: clang-cl/xwin plus Wine).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Release tag to build; also builds the installer with its payload and stages the release assets
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.ref && format('release-build-{0}', inputs.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.ref }}

defaults:
  run:
    # Bash on Windows too: a multi-line pwsh step does not stop at a failing native command.
    shell: bash

jobs:
  windows:
    name: Windows DLL
    # Pinned like ubuntu-22.04: a new image changes the toolset that builds the shipped DLL, so a move is a commit.
    runs-on: windows-2025
    steps:
      # The protocol fixtures the tests read must keep their committed line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Visual Studio's ClangCL toolset: the compiler family of the local clang-cl/xwin build, with the SDK the
      # image already has, so nothing is downloaded and no licence is accepted here.
      - name: Build
        run: |
          cmake -S native -B build/native-windows -A x64 -T ClangCL
          cmake --build build/native-windows --config Release --parallel
      - name: Test
        run: ctest --test-dir build/native-windows -C Release --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-dll
          path: build/native-windows/Release/xinput1_3.dll
          if-no-files-found: error
          retention-days: 3

  windows-bridge:
    name: Windows bridge tests
    # The bridge on Windows itself, where Wine cannot stand in: the Java suites on Windows' file system, the native
    # checks and fake host run directly, the pose mapping between Java and the adapter's code, and Java's replacements
    # beside a reader that shares like Lua's. Nothing here touches a game. Not for release builds: their commit passed it.
    if: ${{ !inputs.ref }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Java suites
        run: python tools/check.py --only minecraft
      # The DLL, the native checks and the fake host (callers report included), built with the release DLL's toolset.
      - name: Native checks
        run: python tools/check.py --only windows
      # Java creates and maps the pose file (SharedMapping's Kernel32 branch), the fixture opens it as the adapter does,
      # publishes until Java stops, and releases it; Java then deletes it. The fixture's budget exceeds Java's count.
      - name: Pose mapping interop
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP")/pose-interop"
          log="$RUNNER_TEMP/pose-interop.log"
          mkdir -p "$dir"
          trap 'cat "$log"' EXIT
          (cd minecraft && ./gradlew.bat -q avatarStreamInterop -PposeInterop="$dir 200") > "$log" 2>&1 &
          java=$!
          for _ in $(seq 240); do grep -q '^READY' "$log" && break; sleep 0.5; done
          build/native-windows-fixture/Release/stellar_pose_stream_fixture.exe "$dir" 1000
          wait "$java"
          grep -q '^PASS pose interop' "$log"
      # Lua's MSVC fopen shares no delete: Java's replacements of terrain.txt must outlast it (the bounded retry), and
      # its reads of a file the C side removes and renames must read a pending removal as absent.
      - name: File sharing beside Lua's reader
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP")/share-stress"
          mkdir -p "$dir"
          build/native-windows-fixture/Release/stellar_share_stress.exe "$dir" &
          reader=$!
          (cd minecraft && ./gradlew.bat -q bridgeRuntimeTest --args="$dir 5000")
          wait "$reader"

  linux:
    name: Linux checks and installer
    needs: windows
    # Ubuntu 22.04 for glibc 2.35: the release installer runs on that glibc or newer.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # CUE4Parse, pinned in tools/eve-extract; its own submodule (ACL, for the natives EveExtract skips) is not needed.
          submodules: true
      # EveExtract: tools/check.py publishes both sidecars (linux-x64 and win-x64) from here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # tools/payload.py needs tomllib (Python 3.11+); the image's own Python is 3.10.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Lua 5.4 and Rust
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends lua5.4
          lua -v && command -v luac
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: installer
      # Where tools/payload.py and the installer's tests look for the DLL.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-dll
          path: build/native-windows
      # Release: the tag must name the version the files carry, before anything is built from it.
      - name: Check the tag against the version files
        if: inputs.ref
        run: |
          version=${TAG#v}
          grep -qx "version = \"$version\" # x-release-please-version" installer/Cargo.toml &&
            grep -qx "version = '$version' // x-release-please-version" minecraft/build.gradle ||
            { echo "::error::$TAG does not match installer/Cargo.toml and minecraft/build.gradle"; exit 1; }
      - name: Check
        run: python3 tools/check.py
      # The two sidecars tools/check.py built, with the SHA256SUMS whose digests the installers embed with them.
      - name: Check the EveExtract sidecars
        run: |
          cd build/eve-extract
          sha256sum -c SHA256SUMS
          [[ $(wc -l < SHA256SUMS) == 2 ]] && grep -q ' eve-extract-linux-x64$' SHA256SUMS && grep -q ' eve-extract-win-x64.exe$' SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eve-extract
          path: build/eve-extract/
          if-no-files-found: error
          retention-days: 3
      # The payload both installers embed: the Lua mod, the DLL, the JAR and Fabric API of this commit.
      - name: Stage the payload
        run: python3 tools/payload.py "$PWD/build/payload"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload
          path: build/payload/
          if-no-files-found: error
          retention-days: 3
      # --version loads the payload (every file's sha256, the Fabric API pin and the DLL's PE header) and names the
      # embedded sidecar's sha256. Outside a release it runs the debug build tools/check.py made with the same payload.
      - name: Smoke test
        run: |
          version=$(sed -n 's/^version = "\(.*\)" # x-release-please-version$/\1/p' installer/Cargo.toml)
          profile=debug
          if [[ -n $TAG ]]; then
            profile=release
            SBMC_PAYLOAD="$PWD/build/payload" SBMC_EVE_EXTRACT="$PWD/build/eve-extract" \
              cargo build --release --locked --manifest-path installer/Cargo.toml
          fi
          out=$("installer/target/$profile/stellar-bridge-installer" --version)
          echo "$out"
          expected="stellar-bridge-installer $version (bridge $version+$(git rev-parse --short=7 HEAD), Lua revision"
          sidecar=$(sed -n 's/^\([0-9a-f]\{64\}\)  eve-extract-linux-x64$/\1/p' build/eve-extract/SHA256SUMS)
          [[ $out == "$expected"* && $out == *", EveExtract $sidecar)" ]] ||
            { echo "::error::expected '$expected ..., EveExtract $sidecar)'"; exit 1; }
          licences=$("installer/target/$profile/stellar-bridge-installer" --licenses)
          [[ $licences == *'==> CUE4Parse.NOTICE'* ]] || { echo "::error::--licenses lacks EveExtract's notices"; exit 1; }

      # Release only, from here on.
      - name: Stage the release assets
        if: inputs.ref
        run: |
          version=${TAG#v}
          mkdir build/release
          cp installer/target/release/stellar-bridge-installer build/release/stellar-bridge-installer-linux-x86_64
          cp "minecraft/build/libs/stellar-bridge-$version.jar" build/native-windows/xinput1_3.dll build/release/
          cp build/eve-extract/eve-extract-linux-x64 build/eve-extract/eve-extract-win-x64.exe build/release/
          git archive --format=zip --prefix=StellarCollisionProbe/ --mtime="$(git log -1 --format=%cI)" \
            -o "build/release/StellarCollisionProbe-$version.zip" HEAD:stellar/Mods/StellarCollisionProbe
          ls -l build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.ref
        with:
          name: release-assets
          path: build/release/
          if-no-files-found: error
          retention-days: 3

  windows-installer:
    name: Windows installer
    needs: linux
    runs-on: windows-2025
    env:
      TAG: ${{ inputs.ref }}
      # The payload the Linux job staged and its installer embeds; the tests then install the real pieces too.
      SBMC_PAYLOAD: ${{ github.workspace }}/build/payload
      # The EveExtract sidecars the Linux job built: the installer embeds the Windows one.
      SBMC_EVE_EXTRACT: ${{ github.workspace }}/build/eve-extract
    steps:
      # The vendored binaries and the licence texts the exe embeds keep their committed bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The MSVC target with the image's Visual Studio linker and Windows SDK resource compiler; the declared minimum
      # Rust is set by sysinfo, which only the Windows build uses, so it is checked here.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' installer/Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload
          path: build/payload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eve-extract
          path: build/eve-extract
      # The Windows sidecar on Windows itself: help, licences, and the exit codes of bad arguments and of a missing input.
      # The Linux job smoke-tested the Linux build only (no Wine there). Nothing here reads game files.
      - name: EveExtract smoke test
        run: |
          exe=build/eve-extract/eve-extract-win-x64.exe
          tmp=$(cygpath -m "$RUNNER_TEMP")
          mkdir -p "$tmp/eve-extract-bundle"
          export DOTNET_BUNDLE_EXTRACT_BASE_DIR="$tmp/eve-extract-bundle"
          # Read whole, not piped to grep -q: an early close would fail the writer under pipefail.
          # A plain assignment stops the step when the program fails; one inside an && list would not.
          help=$("$exe" --help)
          [[ $help == *'never downloaded'* ]]
          licences=$("$exe" --licenses)
          [[ $licences == *'Apache License'* && $licences == *'==> dotnet.THIRD-PARTY-NOTICES'* ]]
          set +e
          "$exe"; usage=$?
          "$exe" --paks "$tmp/absent" --usmap x --oodle y --out "$tmp/eve-extract-out" json X; missing=$?
          set -e
          [[ $usage == 2 && $missing == 3 && ! -e $tmp/eve-extract-out ]] ||
            { echo "::error::eve-extract exit codes: $usage (expected 2), $missing (expected 3)"; exit 1; }
      - name: Lint and test
        working-directory: installer
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo "+$MSRV" check --locked --all-targets
      - name: Build
        run: |
          profile=debug
          if [[ -n $TAG ]]; then profile=release; fi
          cargo build --locked ${TAG:+--release} --manifest-path installer/Cargo.toml
          echo "EXE=installer/target/$profile/stellar-bridge-installer.exe" >> "$GITHUB_ENV"
      # The same check as on Linux: the exe loads and verifies the payload of this commit.
      - name: Smoke test
        run: |
          version=$(sed -n 's/^version = "\(.*\)" # x-release-please-version$/\1/p' installer/Cargo.toml)
          out=$("$EXE" --version)
          echo "$out"
          expected="stellar-bridge-installer $version (bridge $version+$(git rev-parse --short=7 HEAD), Lua revision"
          sidecar=$(sed -n 's/^\([0-9a-f]\{64\}\)  eve-extract-win-x64\.exe$/\1/p' build/eve-extract/SHA256SUMS)
          [[ $out == "$expected"* && $out == *", EveExtract $sidecar)" ]] ||
            { echo "::error::expected '$expected ..., EveExtract $sidecar)'"; exit 1; }
          licences=$("$EXE" --licenses)
          [[ $licences == *'==> CUE4Parse.NOTICE'* ]] || { echo "::error::--licenses lacks EveExtract's notices"; exit 1; }
      - name: Stage the release asset
        if: inputs.ref
        run: |
          mkdir -p build/release
          cp "$EXE" build/release/stellar-bridge-installer-windows-x86_64.exe
          ls -l build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.ref
        with:
          name: release-assets-windows
          path: build/release/
          if-no-files-found: error
          retention-days: 3
