<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Stellar Bridge logo, "Split Block" (original artwork, GPL-3.0-or-later): one block split along an S seam
       into two interlocking worlds, black and gold. The seam is filled, so the mark looks the same on any background. -->
  <defs>
    <clipPath id="tile"><rect x="56" y="56" width="400" height="400" rx="84"/></clipPath>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#e2b23f"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#gold)"/>
    <path d="M520 136 H226 A60 60 0 0 0 226 256 H286 A60 60 0 0 1 286 376 H-8 V-8 H520 Z" fill="url(#black)"/>
    <path d="M520 136 H226 A60 60 0 0 0 226 256 H286 A60 60 0 0 1 286 376 H-8" fill="none" stroke="#151515" stroke-width="30"/>
  </g>
  <rect x="57" y="57" width="398" height="398" rx="83" fill="none" stroke="#e2b23f" stroke-opacity="0.55" stroke-width="2"/>
</svg>
